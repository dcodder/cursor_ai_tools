[project]
name = "diagrams-mcp-server"
version = "0.1.0"
description = "MCP server for creating diagrams (Mermaid), tables, figures, and data charts—outputting markdown and image files (PNG/SVG)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diagrams_mcp_server"]
