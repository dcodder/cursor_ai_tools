[project]
name = "pdf-mcp-server"
version = "0.1.0"
description = "MCP server for converting documents (Word, text, HTML, XML, Markdown) to PDF with table of contents and clear tables/images."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "weasyprint>=62.0",
    "mammoth>=1.6.0",
    "markdown>=3.5",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pypandoc>=1.11",
    "xhtml2pdf>=0.2.16",
]

[project.optional-dependencies]
libreoffice = []  # no extra deps; uses system LibreOffice for .doc

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_mcp_server"]
